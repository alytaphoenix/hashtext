[project]
name = "hashtext"
version = "0.1.0"
description = "Content-addressed context cache: fingerprinted, zstd-compressed context blocks with a JSON CLI for agent hot-swap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["zstandard>=0.22"]
keywords = ["context", "cache", "agent", "compression", "content-addressed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
hashtext = "hashtext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
